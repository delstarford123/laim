<!DOCTYPE html>
<html>
<head>
    <title>Insemination History</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-5">
    <h2 class="mb-4">📋 Insemination Scan History</h2>
    <table class="table table-striped">
        <thead class="table-dark">
            <tr>
                <th>Date</th>
                <th>Cow Breed</th>
                <th>Bull Used</th>
                <th>Success Probability</th>
                <th>AI Verdict</th>
            </tr>
        </thead>
        <tbody>
            {% for record in records %}
            <tr>
                <td>{{ record.date.strftime('%Y-%m-%d %H:%M') }}</td>
                <td>{{ record.cow_breed }}</td>
                <td>{{ record.bull_code }}</td>
                <td>{{ record.probability }}%</td>
                <td class="{{ 'text-success' if 'PROCEED' in record.recommendation else 'text-danger' }}">
                    {{ record.recommendation }}
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
    <a href="/" class="btn btn-primary">Back to Scanner</a>
</body>
</html>
